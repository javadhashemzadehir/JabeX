name: Release

# Builds installers and publishes a GitHub Release when a version tag is pushed.
# Example: git tag -a v0.1.0 -m "Release v0.1.0" && git push origin v0.1.0
#
# Windows artifacts only for now (matches tauri.conf.json bundle.targets).
# macOS / Linux bundling is deferred until those targets are configured.
# Unsigned — signing/notarization is future work:
#   - JabeX_<version>_x64-setup.exe  (NSIS)
#   - JabeX_<version>_x64_en-US.msi  (MSI)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build · windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js frontend
        run: pnpm build

      - name: Build Tauri app and attach to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: JabeX ${{ github.ref_name }}
          releaseBody: |
            ## JabeX ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Windows requirements

            - Windows 10 or 11, 64-bit (x64)
            - Microsoft Edge WebView2 Runtime (usually preinstalled)

            ### Downloads

            - **Windows:** `JabeX_*_x64-setup.exe` (NSIS) and `JabeX_*_x64_en-US.msi` (MSI)
            - **Windows portable:** attach `JabeX-*-portable.zip` + `SHA256SUMS.txt` from `pnpm release:assemble` if not uploaded by CI

            Installers are **unsigned** for now (Authenticode / notarization planned later).
            Windows SmartScreen may warn on first run — choose “More info” → “Run anyway” when you trust the build.

            Privacy-first · offline-first · flashcards only · no accounts · no telemetry · no auto-updater.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          args: "--bundles nsis,msi"

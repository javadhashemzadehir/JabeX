name: Release

# Builds installers and publishes a GitHub Release when a version tag is pushed.
# Example: git tag -a v0.1.0 -m "Release v0.1.0" && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msi
            platform: windows-latest
            args: "--bundles msi"
          - name: macos-dmg
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux-appimage
            platform: ubuntu-22.04
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js frontend
        run: pnpm build

      - name: Build Tauri app and attach to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: JabeX ${{ github.ref_name }}
          releaseBody: |
            ## JabeX ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Downloads

            - **Windows:** `.msi`
            - **macOS:** `.dmg`
            - **Linux:** `.AppImage`

            Privacy-first · offline-first · flashcards only.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}

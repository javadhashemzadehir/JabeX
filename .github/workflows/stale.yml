name: Stale

on:
  schedule:
    # Daily 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues/PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Stale bot
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been marked as stale because it has been inactive for 60 days.
            It will be closed in 14 days if there is no further activity.
          close-issue-message: >
            Closing this issue due to inactivity. Please reopen or file a new issue if this is still relevant.
          stale-pr-message: >
            This pull request has been marked as stale because it has been inactive for 45 days.
            It will be closed in 14 days if there is no further activity.
          close-pr-message: >
            Closing this pull request due to inactivity. Please reopen or open a new PR if work continues.
          exempt-issue-labels: security,good first issue
          exempt-pr-labels: security
          operations-per-run: 50

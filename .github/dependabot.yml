# Dependabot — keep npm and Cargo dependencies current
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: develop
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - rust
      - chore
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
